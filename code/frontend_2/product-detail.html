<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết sản phẩm</title>

    <!-- Nhập icon & Font -->
    <link rel="icon" type="png" href="logo 1.png">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <!-- Link tới CSS -->
    <link rel="stylesheet" href="product-detail-style.css">
</head>
<body>

<header>
    <div class="logo_home" onclick="window.location.href='index.html'">
        TECHNALG
    </div>
</header>
<div class="hero-section">
    <div class="brand-logo-big" onclick="location.reload()" style="cursor:pointer">
        <span class="brand-techna">Techna</span><span class="brand-lg">LG</span>
    </div>
<main>
    <div class="product-detail-container">

        <!-- ẢNH -->
        <div class="product-image-box">
            <img id="product-img" src="" alt="product">
        </div>

        <!-- INFO -->
        <div class="product-info">

            <h1 id="product-title">Tên sản phẩm</h1>

            <div id="product-price" class="price">0đ</div>

            <div id="product-desc" class="description">
                Mô tả sản phẩm...
            </div>

            <button class="buy-btn">MUA NGAY</button>

        </div>

    </div>
</main>

<!-- JS của bạn -->
<script src="product-detail-scripts.js"></script>

</body>
</html>
