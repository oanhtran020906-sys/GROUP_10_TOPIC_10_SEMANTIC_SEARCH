<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> TechnaLG </title>
    <link rel="icon" type="png" href="logo 1.png">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <!-- Link tới file CSS -->
    <link rel="stylesheet" href="index-style.css">
</head>

<body>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>
<div class="stars"></div>
<div class="sidebar" id="sidebar">
    <h2>Danh mục</h2>
    <ul class="category-list">
        <li onclick="filterBy(8, 'laptop')">Laptop</li>
        <li onclick="filterBy(6, 'màn hình')">Màn hình</li>
        <li onclick="filterBy(2, 'điện thoại')">Điện thoại</li>
        <li onclick="filterBy(4, 'máy tính bảng')">Máy tính bảng</li>
        <li onclick="filterBy(5, 'bàn phím')">Bàn phím</li>
        <li onclick="filterBy(9, 'chuột')">Chuột</li>
        <li onclick="filterBy(10, 'loa')">Loa</li>
        <li onclick="filterBy(7, 'tai nghe')">Tai nghe</li>
        <li onclick="filterBy(1, 'camera')">Camera</li>
        <li onclick="filterBy(3, 'smartwatch')">Smartwatch</li>
    </ul>
</div>

<header>
    <div class="menu-btn" onclick="toggleMenu()">☰ DANH MỤC SẢN PHẨM </div>

    <div class="search-options">
        <div class="option" id="sql-opt" onclick="setMode('sql')">SQL</div>
        <div class="option" id="vec-opt" onclick="setMode('vec')">VECTOR</div>
        <div class="option" id="hybrid-opt" onclick="setMode('hybrid')">HYBRID</div>

    </div>
</header>

<div class="hero-section" style="position: relative;"> <div class="brand-logo-big" onclick="location.reload()" style="cursor:pointer">
        <span class="brand-techna">Techna</span><span class="brand-lg">LG</span>
    </div>

    <p class="hero-subtitle">
        Empowering Digital Change
    </p>

    <div class="big-search-wrapper">
        <input type="text" class="big-search-bar" id="search-input" placeholder="Tìm kiếm...">
        <img src="loupe.png" class="search-icon" onclick="handleSearch()" />

        <img src="search.png" class="search-by-image-icon" onclick="handleImageSearch()" />
    </div>

    <div class="scroll-text" onclick="document.getElementById('product-section').scrollIntoView()" style="cursor:pointer">
        ▼ SIÊU PHẨM CÔNG NGHỆ 2026 ▼
    </div>

    <div id="loading" style="display: none; text-align: center; padding: 20px;">
        <div class="spinner" style="border: 4px solid rgba(0, 255, 255, 0.1); border-left-color: cyan; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 10px;"></div>
        <p style="color: cyan; font-family: 'Press Start 2P'; font-size: 10px;">SEARCHING...</p>
    </div>

    <div id="modal" class="modal" style="display: none; align-items: center; justify-content: center; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; background: rgba(0, 0, 0, 0.7);">
        <div class="box" style="position: relative; cursor: default;">
            <span class="exit-icon" onclick="closePopup()" style="position: absolute; right: 15px; top: 10px; cursor: pointer; z-index: 10;">×</span>
            
            <div class="uploadpack" onclick="uploadImage()" style="cursor: pointer;">
                <img id="preview-img" src="" style="display: none; max-width: 200px; max-height: 200px; object-fit: contain; margin-bottom: 10px; filter: none !important;">
                
                <img id="default-icon" class="image-icon" src="image.png">
                
                <div class="upload">
                    <input type="file" id="inputfile" hidden>
                    <p class="text-upload" id="upload-text"> UPLOAD IMAGE </p>
                </div>
            </div>

            <div style="text-align: center; margin-top: 10px;">
                <button id="search-btn" onclick="executeImageSearch()" style="display: none; padding: 10px 20px; background: #00ffff; color: #000; border: none; font-family: 'Press Start 2P', cursive; cursor: pointer; font-size: 10px; box-shadow: 4px 4px 0px #008080;">
                    SEARCH NOW
                </button>
            </div>
        </div>
    </div>
</div>

<main class="main-content" id="product-section">
    <h2 class="section-title">
        SẢN PHẨM <span id="cat-name">NỔI BẬT</span>
    </h2>
    <div class="products-grid" id="product-display"></div>
</main>

<style>
@keyframes spin {
    to { transform: rotate(360deg); }
}
</style>

<!-- LINK JS -->
<script src="index-scripts.js"></script>

</body>
</html>
