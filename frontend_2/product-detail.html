<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết sản phẩm | TechnaLG</title>
    <link rel="stylesheet" href="product-detail-style.css">
</head>
<body>

    <header>
        <nav>
            <ul>
                <li><a href="index.html">← Quay lại trang chủ</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="product-main">
            <div class="product-gallery">
                <img src="" alt="Sản phẩm" id="product-img" style="max-width: 100%; border-radius: 10px;">
            </div>

            <div class="product-summary">
                <h1 id="product-title">Đang tải tên sản phẩm...</h1>
                
                <p class="price" id="product-price" style="font-size: 24px; color: #00ffff; font-weight: bold;">Giá: --</p>
                
                <div id="description" style="margin-top: 20px;">
                    <h3>Mô tả sản phẩm:</h3>
                    <div id="product-desc" style="line-height: 1.6; color: #ccc;">
                        Đang tải mô tả...
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 TechnaLG Ecosystem</p>
    </footer>

    <script src="product-detail-scripts.js"></script>
</body>
</html>
